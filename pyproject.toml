[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeride"
version = "2.0.0"
description = "Free AI for Hermes Agent - Automatic free model management via OpenRouter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.scripts]
freeride = "main:main"
freeride-watcher = "watcher:main"
